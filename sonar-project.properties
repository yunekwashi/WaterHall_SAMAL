# =====================================================================
# SonarCloud Configuration File for WATER-HALL Capstone
# GitHub Repo: https://github.com/yunekwashi/WaterHall_SAMAL
# =====================================================================

sonar.organization=yunekwashi
sonar.projectKey=yunekwashi_WaterHall_SAMAL
sonar.projectName=WaterHall_SAMAL

# Source encoding
sonar.sourceEncoding=UTF-8

# Source files to analyze
sonar.sources=server.py,lib,web,admin_web,waterhall_flutter/lib,waterhall_resident_flutter/lib

# Exclude compiled binaries, databases, and third-party artifacts
sonar.exclusions=\
  **/*.apk,\
  **/*.db,\
  **/*.sqlite,\
  **/*.pdf,\
  **/*.png,\
  **/*.jpg,\
  **/*.webp,\
  **/__pycache__/**,\
  **/.dart_tool/**,\
  **/dart-sdk/**,\
  **/android-app.bak/**,\
  **/out.js*,\
  web/app.js,\
  web/app.js.deps,\
  web/app.js.map,\
  **/build/**,\
  **/.idea/**,\
  **/.git/**

# Language settings
sonar.python.version=3.10,3.11,3.12
