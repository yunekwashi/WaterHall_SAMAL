name: waterhall_flutter
description: WATERHALL Mobile App WebView Wrapper in Flutter.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.4.2
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6
  webview_flutter_web: ^0.2.3+4
  flutter_local_notifications: ^17.2.1
  workmanager: ^0.10.10
  http: ^1.2.0
  flutter_secure_storage: ^10.0.0
  image_picker: ^1.1.2
  image_picker_android: ^0.8.13+23
  image_picker_platform_interface: ^2.11.1
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
