name: WaterHall verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/audit_repository.py
      - run: python scripts/audit_git_history.py
      - run: python -m pytest -q
      - run: python -m playwright install --with-deps chrome
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
          RUN_BROWSER_TESTS: '1'
      - run: python -m pip_audit -r requirements.txt --progress-spinner off
      - run: python scripts/build_static.py
